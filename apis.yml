aid: billables-ai
name: Billables Ai
description: >-
  Billables AI is a San Francisco based legal technology company that builds
  AI-powered automatic time tracking software for lawyers, consultants, and
  professional services firms. Its platform passively captures billable activity
  as people work across the tools they already use — Microsoft 365, Outlook,
  Teams, Zoom, Adobe, and the Chrome and Edge browsers — then uses AI to draft
  time entries, assign the correct client and matter, and write narrative
  descriptions, learning and adapting to each user over time. Privacy is
  user-controlled, with only the individual able to view or edit their own time
  records before they are submitted. The company is venture-backed (Series A)
  and was surfaced through the Wing Venture Capital portfolio.
